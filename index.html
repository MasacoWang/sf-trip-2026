const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function sfNow() {
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, mins:(+p.hour%24)*60 + +p.minute, label:`${p.hour}:${p.minute}`};
}
const startMins = t => { const m = t.match(/(\d{1,2}):(\d{2})/); return m ? +m[1]*60 + +m[2] : null; };

    ${EATS.map(e=>`<div class="eat-day" id="eats-${e.day}" style="--day-color:${dayColor[e.day]};--n:${e.meals.length}">
      <div class="eat-day-head"><b>${esc(e.label)}</b><span>${esc(e.area)}</span></div>
      ${e.meals.map(m=>`<div class="card eat-meal"><div class="eat-meal-head"><b>${esc(m.meal)}</b><span class="chip">📍 ${esc(m.where)}</span></div>
        <ul class="eat-list">${m.list.map(([n,t,w,q,on])=>`<li class="${on?"on":""}">
          <div class="eat-info"><a href="${maps(q)}" target="_blank" rel="noopener" class="eat-name">${on?"⭐ ":""}${esc(n)}</a>
            <span class="eat-type">${esc(t)}</span><span class="eat-why">${esc(w)}</span></div>
          <div class="eat-btns"><a class="btn primary" href="${maps(q)}" target="_blank" rel="noopener">📍</a><a class="btn" href="${dir(q,"walking")}" target="_blank" rel="noopener">🧭</a></div>
        </li>`).join("")}</ul></div>`).join("")}
    </div>`).join("")}
  </section>`;
  main.innerHTML = DAYS.map(d => {
    let nowIdx = -1;
    return `<section id="${d.id}" class="day hidden">
      <div class="card day-head"><h2>${esc(d.title)}</h2><div class="sub">${esc(d.sub)}</div>
        ${(d.alerts||[]).map(a=>`<div class="alert ${a.t==="tip"?"tip":""}">${esc(a.h)}</div>`).join("")}
        ${d.route?`<details class="route" open><summary>🗺️ 路線一眼看懂</summary><div class="route-list">${d.route.map(x=>`<span>${esc(x)}</span>`).join("")}</div></details>`:""}</div>
      <div class="timeline">${d.items.map((it,i)=>`
        <div class="item ${it.star?"star":""} ${i===nowIdx?"now":""}"><div class="card">
          <div class="time">${esc(it.time)}${i===nowIdx?" ・ 進行中":""}</div>
          <div class="title">${esc(it.title)}</div>
          ${(it.food||it.go)?`<div class="meta">${it.food?`<span class="chip">🍽️ ${esc(it.food)}</span>`:""}${it.go?`<span class="chip">${esc(it.go)}</span>`:""}</div>`:""}
          ${it.shop?`<ul class="shop">${it.shop.map(([n,w,q])=>`<li><a href="${maps(q)}" target="_blank" rel="noopener"><b>${esc(n)}</b></a><span>${esc(w)}</span></li>`).join("")}</ul>`:""}
          ${it.steps?`<ol class="steps">${it.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
          ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
          ${it.changed?`<div class="changed"><b>建議調整：</b>${esc(it.changed)}</div>`:""}
          ${it.places?`<div class="btns">${it.places.map(([n,q,m])=>`<a class="btn primary" href="${maps(q)}" target="_blank" rel="noopener">📍 ${esc(n)}</a><a class="btn" href="${dir(q,m)}" target="_blank" rel="noopener">🧭 導航</a>`).join("")}</div>`:""}
          ${it.src?`<div class="src">來源：${it.src.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div>`:""}
        </div></div>`).join("")}</div></section>`;
  }).join("") + eatsHtml + `<section id="tips" class="day hidden"><div class="card"><h2 style="margin:0">📋 建議調整重點</h2>
    <ul class="tips">
      <li><b>Day 2 輕鬆版</b>：F-Line 單次搭乘到 Pier 39；九曲花街從下方拍，拍完回飯店；晚上不排景點。</li>
      <li><b>Day 3 時間</b>：出門前確認手機／手錶時間一致。</li>
      <li><b>Day 3 SFMOMA</b>：週日 10:00–17:00，建議先買票。</li>
      <li><b>Day 4 Little Italy</b>：Uber 來回，行李已寄放飯店。</li>
      <li><b>Day 4 去機場</b>：4 人＋行李叫 UberXL；跟櫃台確認行李寄放時間。</li>
    </ul></div>
    <div class="card"><h2 style="margin:0 0 6px">🗺️ 所有地點</h2><div class="btns">
      ${Object.entries({"Hotel":P.hotel,"Ferry Building":P.ferry,"Pier 39":P.pier39,"Fisherman's Wharf":P.wharf,"Ghirardelli":P.ghirardelli,"九曲花街（下方）":P.lombardBottom,"金門大橋":P.ggb,"藝術宮":P.pfa,"Pacific Catch":P.pacificcatch,"SFMOMA":P.sfmoma,"North Beach":P.northbeach,"Fish & Farm":P.fishfarm,"Dandelion":P.dandelion,"Recchiuti":P.recchiuti,"Stonehouse":P.stonehouse,"SFO":P.sfo}).map(([n,q])=>`<a class="btn" href="${maps(q)}" target="_blank" rel="noopener">📍 ${esc(n)}</a>`).join("")}
    </div></div></section>`;

  const show = id => {
    document.querySelectorAll(".day").forEach(s => s.classList.toggle("hidden", s.id !== id));
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.id === id));
    history.replaceState(null, "", "#" + id);
    window.scrollTo({top:0});
  };
  tabs.onclick = e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.id); };
  main.addEventListener("click", e => { const a = e.target.closest(".jump a"); if (!a) return; e.preventDefault();
    document.querySelector(a.getAttribute("href")).scrollIntoView({behavior:"smooth", block:"start"}); });
  const hash = location.hash.slice(1);
  show(document.getElementById(hash) ? hash : "d1");
  const cur = document.querySelector(".day:not(.hidden) .item.now");
  if (cur && !hash) cur.scrollIntoView({block:"center"});
}
render();
const tt = document.getElementById("toTop");
addEventListener("scroll", () => tt.classList.toggle("show", scrollY > 500), {passive:true});
tt.onclick = () => scrollTo({top:0, behavior:"smooth"});
</script>
</body>
</html>
